services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Fixed in-container paths on the named volume (override any .env value).
      DATABASE_URL: sqlite:////data/app.db
      LLM_CACHE_DIR: /data/litellm-cache
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    healthcheck:
      # python:slim has no curl; use the standard library.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing backend URL, baked in at build time.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    # Not gated on backend health: the UI must load and show errors even if
    # the backend is not ready (e.g. missing keys).
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
